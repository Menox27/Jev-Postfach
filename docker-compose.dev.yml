version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - IMAP_HOST=imap.mail.me.com
      - IMAP_PORT=993
      - IMAP_USER=
      - IMAP_PASS=
      - JEV_API_KEY=
      - JEV_MODEL=typesafe/jev-1.13
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:3000
    command: npm start
