version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - IMAP_HOST=imap.mail.me.com
      - IMAP_PORT=993
      - IMAP_USER=
      - IMAP_PASS=
      - JEV_API_KEY=
      - JEV_MODEL=typesafe/jev-1.13
    volumes:
      - ./backend/dist:/app/dist
      - ./backend/emails.db:/app/emails.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:3000"
    environment:
      - REACT_APP_API_URL=/api
